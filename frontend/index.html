<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古代石窟风化速率监测与保护材料优选系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e0e0e0; z-index: 9999;
    }
    #loading .spinner {
      width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #f39c12; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    #loading h2 { margin-top: 24px; font-size: 20px; letter-spacing: 2px; }
    #loading p { margin-top: 8px; font-size: 13px; opacity: 0.6; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>石窟风化监测系统</h2>
    <p>Grotto Weathering Monitoring System</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const el = document.getElementById('loading');
        if (el) { el.style.opacity = '0'; el.style.transition = 'opacity 0.5s'; setTimeout(() => el.remove(), 500); }
      }, 800);
    });
  </script>
</body>
</html>
