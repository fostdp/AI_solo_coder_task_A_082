version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: grotto-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grotto_monitor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - grotto-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: -c 'config_file=/etc/postgresql/postgresql.conf'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-grotto_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - grotto-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grotto-backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-grotto_monitor}
      DB_SSLMODE: disable
      PORT: 8080
      STATIC_PATH: /app/frontend
      CONFIG_PATH: /app/config/model_params.json
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - grotto-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: grotto-simulator
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_HOST: backend
      API_PORT: 8080
      CONTROL_PORT: 8081
      INTERVAL_HOURS: ${INTERVAL_HOURS:-1}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-30}
      BACKFILL: ${BACKFILL:-true}
    ports:
      - "${SIMULATOR_PORT:-8081}:8081"
    networks:
      - grotto-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: grotto-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - grotto-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: grotto-prometheus
    restart: unless-stopped
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
    networks:
      - grotto-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    container_name: grotto-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - timescaledb
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/grotto-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
    networks:
      - grotto-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  grotto-data:
  prometheus-data:
  grafana-data:

networks:
  grotto-net:
    driver: bridge
